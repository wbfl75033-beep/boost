<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수료증 발급 · 신입 FP 스타트 부스터 과정</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&family=Noto+Sans+KR:wght@400&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"PretendardLocal";font-weight:400;font-style:normal;font-display:swap;src:url("/certificate/vendor/Pretendard-Regular.woff2") format("woff2")}
@font-face{font-family:"PretendardLocal";font-weight:600;font-style:normal;font-display:swap;src:url("/certificate/vendor/Pretendard-SemiBold.woff2") format("woff2")}
@font-face{font-family:"PretendardLocal";font-weight:700;font-style:normal;font-display:swap;src:url("/certificate/vendor/Pretendard-Bold.woff2") format("woff2")}
/* 랜딩페이지(/landing)와 같은 색·글꼴·버튼 */
:root{
  color-scheme:light;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-soft:#E8F3FF;
  --ink:#191F28; --ink-2:#333D4B; --grey:#4E5968; --grey-2:#6B7684; --grey-3:#8B95A1; --grey-4:#B0B8C1;
  --line:#E5E8EB; --band:#F2F4F6; --band-2:#F9FAFB; --white:#FFFFFF; --red:#F04452;
  --font:"PretendardLocal",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --maxw:1200px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,p{margin:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo img{display:block;height:38px;width:auto}
.nav-t{font-size:15px;font-weight:600;color:var(--grey)}

/* head */
.head{background:var(--band-2);padding-block:48px 40px;text-align:center}
.label{font-size:16px;font-weight:700;color:var(--blue)}
.h1{font-size:clamp(30px,4.4vw,44px);font-weight:700;line-height:1.3;letter-spacing:-.035em;margin-top:10px}
.lead{font-size:clamp(16px,1.8vw,18px);font-weight:400;color:var(--grey);margin-top:12px}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:start;padding-block:40px 80px}

/* form */
.card{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:28px 26px}
.fld{display:block;margin-bottom:18px}
.fld > span,.fld-t{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.fld input{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--band-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.fld input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.15);background:var(--white)}
.fld input::placeholder{color:var(--grey-4)}
.two{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.two i{font-style:normal;color:var(--grey-3)}
/* 수료번호: 앞부분(FP-NSB-)은 고정, 숫자만 입력 */
.pre{display:flex;align-items:stretch;background:var(--band-2);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,box-shadow .15s,background .15s}
.pre:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,130,246,.15);background:var(--white)}
.pre b{display:flex;align-items:center;padding-left:14px;font-weight:600;font-size:16px;color:var(--grey-2);white-space:nowrap}
.fld .pre input{border:0;background:transparent;box-shadow:none;padding-left:4px}
.fld .pre input:focus{box-shadow:none;background:transparent}
.sub{font-size:13px;color:var(--grey-3);margin-top:6px}

/* 이수 / 미이수 선택 */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{font:inherit;font-size:16px;font-weight:600;padding:12px 10px;border-radius:12px;border:1px solid var(--line);background:var(--band-2);color:var(--grey);cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.pick button:hover{border-color:var(--grey-4)}
.pick button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.pick button:focus-visible{outline:3px solid rgba(49,130,246,.4);outline-offset:2px}

.divider{height:1px;background:var(--line);margin:8px 0 22px}

/* size toggle */
.size{display:flex;gap:6px;background:var(--band);border-radius:12px;padding:4px;margin-bottom:14px}
.size button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:9px;padding:8px 6px;background:transparent;color:var(--grey-2);cursor:pointer}
.size button.on{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* buttons */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:-.01em;padding:15px 18px;border-radius:16px;border:0;cursor:pointer;background:var(--band);color:var(--ink-2);transition:background .15s,transform .15s}
.btn:hover{background:#E5E8EB}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid rgba(49,130,246,.4);outline-offset:2px}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d)}
.btn-soft{background:var(--blue-soft);color:var(--blue)}
.btn-soft:hover{background:#D6E8FF}
.btn[disabled]{opacity:.5;cursor:default}
.msg{min-height:1.5em;margin-top:12px;font-size:14px;color:var(--grey-2);text-align:center}
.msg.err{color:var(--red)}

/* 이전 기록 */
.hist{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.hist-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.hist-h b{font-size:15px;font-weight:700;color:var(--ink)}
.hist-h button{font:inherit;font-size:13px;color:var(--grey-3);background:none;border:0;padding:4px;cursor:pointer}
.hist-h button:hover{color:var(--red)}
.hist-note{font-size:12.5px;color:var(--grey-3);margin-bottom:10px}
.hist ul{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;align-items:center;gap:4px;background:var(--band-2);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,background .15s}
.hist li:hover{border-color:var(--grey-4)}
.hist li.on{border-color:var(--blue);background:var(--blue-soft)}
.hist .go{flex:1;min-width:0;text-align:left;font:inherit;background:none;border:0;padding:10px 4px 10px 14px;cursor:pointer;color:var(--ink)}
.hist .go:focus-visible{outline:3px solid rgba(49,130,246,.4);outline-offset:-3px;border-radius:12px}
.hist .t{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .t small{font-weight:400;color:var(--grey-2);font-size:13px;margin-left:6px}
.hist .s{display:block;font-size:12.5px;color:var(--grey-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .del{flex:none;width:34px;height:34px;margin-right:6px;border:0;background:none;border-radius:8px;color:var(--grey-4);font-size:18px;line-height:1;cursor:pointer}
.hist .del:hover{color:var(--red);background:var(--band)}
.hist-empty{font-size:13.5px;color:var(--grey-3);padding:6px 0}

/* preview */
.preview{position:sticky;top:84px;background:var(--band);border-radius:24px;padding:28px}
.preview canvas{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;border-radius:4px;box-shadow:0 24px 50px -20px rgba(0,27,55,.25),0 2px 8px rgba(0,0,0,.06)}

footer{background:var(--band-2);color:var(--grey-3);font-size:14px;padding-block:32px 44px}
footer b{color:var(--grey);font-weight:600}
footer .wrap{display:flex;flex-direction:column;gap:4px}

@media (max-width:900px){
  .main{grid-template-columns:1fr;gap:24px;padding-block:24px 56px}
  .preview{position:static;padding:16px;border-radius:20px}
  .head{padding-block:32px 28px}
}
@media (max-width:480px){
  .wrap{padding-left:16px;padding-right:16px}
  .logo img{height:30px}
  .card{padding:22px 18px;border-radius:20px}
  .btn{font-size:16px;padding:14px 12px}
}
</style>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-in">
    <a href="https://fppartners.co.kr/" class="logo" target="_blank" rel="noopener" aria-label="FP파트너즈 홈페이지 (새 탭)"><img src="/certificate/logo.webp" alt="FP파트너즈 세일즈 역량 AI 진단 플랫폼"></a>
    <span class="nav-t">수료증 발급</span>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <div class="label">신입 FP 스타트 부스터 과정</div>
    <h1 class="h1">수료증 발급</h1>
    <p class="lead">내용을 입력하면 수료증에 바로 반영됩니다.<br>저장한 파일은 이 컴퓨터에만 내려받아집니다.</p>
  </div>
</header>

<main class="wrap main">
  <section class="card" aria-label="수료증 내용 입력">
    <label class="fld"><span>수료번호 <small style="font-weight:400;color:var(--grey-3)">(숫자만 입력)</small></span>
      <div class="pre"><b>FP-NSB-</b><input type="text" id="number" inputmode="numeric" placeholder="2" maxlength="5" autocomplete="off" aria-label="수료번호 숫자"></div>
      <div class="sub" id="numberOut">숫자를 넣으면 FP-NSB-00002처럼 다섯 자리로 바뀝니다.</div>
    </label>

    <label class="fld"><span>이름</span>
      <input type="text" id="name" placeholder="홍길동" autocomplete="off" maxlength="20">
    </label>

    <div class="fld">
      <span class="fld-t">교육기간</span>
      <div class="two">
        <input type="date" id="start" aria-label="교육 시작일">
        <i>~</i>
        <input type="date" id="end" aria-label="교육 종료일">
      </div>
    </div>

    <div class="fld">
      <span class="fld-t" id="aiLabel">AI 스마트 시험과정</span>
      <div class="pick" role="radiogroup" aria-labelledby="aiLabel">
        <button type="button" role="radio" data-ai="1" class="on" aria-checked="true">이수</button>
        <button type="button" role="radio" data-ai="0" aria-checked="false">미이수 ( — )</button>
      </div>
    </div>

    <label class="fld"><span>수료증 발급일</span>
      <input type="date" id="issued">
    </label>

    <div class="divider"></div>

    <div class="size" role="radiogroup" aria-label="이미지 크기">
      <button type="button" role="radio" data-scale="1" class="on" aria-checked="true">원본 크기</button>
      <button type="button" role="radio" data-scale="3" aria-checked="false">인쇄용 고해상도</button>
    </div>
    <div class="btns">
      <button type="button" class="btn btn-blue" id="savePng">이미지 저장</button>
      <button type="button" class="btn btn-soft" id="savePdf">PDF 저장</button>
    </div>
    <p class="msg" id="msg" role="status"></p>

    <div class="hist" aria-label="이전 기록">
      <div class="hist-h"><b>이전 기록</b><button type="button" id="histClear">전체 지우기</button></div>
      <p class="hist-note">저장한 수료증이 여기에 남습니다. 누르면 그 내용이 다시 채워집니다. (이 컴퓨터의 브라우저에만 보관)</p>
      <ul id="histList"></ul>
      <p class="hist-empty" id="histEmpty">아직 저장한 수료증이 없습니다.</p>
    </div>
  </section>

  <section class="preview" aria-label="수료증 미리보기">
    <canvas id="canvas" width="794" height="1123" role="img" aria-label="수료증 미리보기"></canvas>
  </section>
</main>

<footer>
  <div class="wrap">
    <b>에프피파트너즈㈜</b>
    <span>fppartners.co.kr&nbsp;· 02-525-1686</span>
  </div>
</footer>

<script src="/certificate/vendor/jspdf.umd.min.js"></script>
<script>
/* ---------- 수료증 레이아웃 (원본 794 × 1123 기준 좌표) ---------- */
const W = 794, H = 1123;
const TEXT = '#333333';
const L = {
  number:  { font: '400 20px "PretendardLocal"', color: TEXT, x: 698.5, y: 86, align: 'right', spacing: -0.45 },
  name:    { font: '600 32px "Noto Serif KR"', color: TEXT, x: 325, y: 420, align: 'left', spacing: 6, bold: 0.4 },
  period:  { font: '400 25px "PretendardLocal"', color: '#000000', x: 326, y: 515, align: 'left', spacing: -0.7 },
  status:  { font: '400 19px "Noto Sans KR"', color: TEXT, x: 638, ys: [718, 754, 790, 825], align: 'center', bold: 0.1 },
  // AI 스마트 시험과정 미이수 표시: 키보드 '-'보다 조금 긴 선, 위 줄 '이수'의 가운데(x 638)에 맞춤
  dash:    { cx: 638, cy: 781, w: 12, h: 1.6, color: '#555555' },
  issued:  { font: '400 23px "Nanum Myeongjo"', color: TEXT, x: 397, y: 927, align: 'center', advance: 11, bold: 0.4 }
};

const FONT_LOADS = [L.number.font, L.name.font, L.status.font, L.issued.font];
const bg = new Image();
// 주소가 /certificate 든 /certificate/ 든 같은 파일을 찾도록 절대 경로 사용
const ready = Promise.all([
  new Promise((res, rej) => {
    bg.onload = res;
    bg.onerror = () => rej(new Error('수료증 바탕 이미지를 불러오지 못했습니다'));
    bg.src = '/certificate/template.png';
  }),
  // 글꼴 하나가 늦거나 실패해도 수료증은 그려지게 함
  Promise.allSettled(FONT_LOADS.map(f => document.fonts.load(f, '가나다 0123456789 FP-NSB 이수참여제호유숙희~.')))
]).then(() => document.fonts.ready);

function drawText(ctx, text, o) {
  ctx.font = o.font;
  ctx.fillStyle = o.color;
  ctx.textBaseline = 'alphabetic';
  const chars = Array.from(text);
  // 글자별 폭: advance(고정폭)이 있으면 숫자·점·공백은 그 폭으로, 아니면 실제 폭 + 자간
  const widths = chars.map(c => (o.advance && /[0-9. ]/.test(c)) ? o.advance : ctx.measureText(c).width);
  const sp = o.spacing || 0;
  const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let x = o.align === 'right' ? o.x - total : o.align === 'center' ? o.x - total / 2 : o.x;
  ctx.textAlign = 'center';
  chars.forEach((c, i) => {
    const cx = x + widths[i] / 2;
    if (o.bold) { ctx.lineWidth = o.bold; ctx.strokeStyle = o.color; ctx.lineJoin = 'round'; ctx.strokeText(c, cx, o.y); }
    ctx.fillText(c, cx, o.y);
    x += widths[i] + sp;
  });
}

function render(canvas, d, scale) {
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bg, 0, 0, W, H);
  if (d.number) drawText(ctx, `제 ${d.number}호`, L.number);
  if (d.name) drawText(ctx, d.name, L.name);
  if (d.period) drawText(ctx, d.period, L.period);
  const st = L.status;
  const statuses = ['이수', '이수', d.ai ? '이수' : null, '참여'];
  statuses.forEach((s, i) => { if (s) drawText(ctx, s, { ...st, y: st.ys[i] }); });
  if (!d.ai) {
    const k = L.dash;
    ctx.fillStyle = k.color;
    ctx.fillRect(k.cx - k.w / 2, k.cy - k.h / 2, k.w, k.h);
  }
  if (d.issued) drawText(ctx, d.issued, L.issued);
  return canvas;
}

/* ---------- 날짜 표기 ---------- */
function parseDate(v) { if (!v) return null; const [y, m, d] = v.split('-').map(Number); return { y, m, d }; }
function fmtPeriod(a, b) {
  const s = parseDate(a), e = parseDate(b);
  if (!s && !e) return '';
  const left = s ? `${s.y}. ${s.m}. ${s.d}` : '';
  if (!e) return left;
  const right = (s && s.y === e.y) ? `${e.m}. ${e.d}` : `${e.y}. ${e.m}. ${e.d}`;
  return left ? `${left} ~ ${right}` : right;
}
function fmtIssued(v) {
  const t = parseDate(v); if (!t) return '';
  const p = n => String(n).padStart(2, '0');
  return `${t.y}. ${p(t.m)}. ${p(t.d)}`;
}

/* ---------- 입력 ---------- */
const $ = id => document.getElementById(id);
let ai = true;
let scale = 1;

function today() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
}
$('issued').value = today();

const NUM_PREFIX = 'FP-NSB-', NUM_DIGITS = 5;
function fullNumber() {
  const n = $('number').value.replace(/\D/g, '');
  return n ? NUM_PREFIX + n.padStart(NUM_DIGITS, '0') : '';
}
$('number').addEventListener('input', e => {
  const clean = e.target.value.replace(/\D/g, '').slice(0, NUM_DIGITS);
  if (clean !== e.target.value) e.target.value = clean;
  const f = fullNumber();
  $('numberOut').textContent = f ? `수료증에는 「제 ${f}호」로 들어갑니다.` : '숫자를 넣으면 FP-NSB-00002처럼 다섯 자리로 바뀝니다.';
});

function data() {
  return {
    number: fullNumber(),
    name: $('name').value.trim(),
    period: fmtPeriod($('start').value, $('end').value),
    issued: fmtIssued($('issued').value),
    ai
  };
}

const canvas = $('canvas');
let drawn = false;
// 웹 글꼴은 한글을 여러 조각으로 나눠 필요한 글자만 내려받음 → 그리기 전에 이름 글자를 먼저 불러와야 다른 글꼴로 바뀌지 않음
function fontsFor(d) {
  return Promise.allSettled([
    d.name && document.fonts.load(L.name.font, d.name),
    d.number && document.fonts.load(L.number.font, d.number)
  ]);
}
let seq = 0;
async function preview() {
  if (!drawn) return;
  const d = data(), my = ++seq;
  render(canvas, d, 2);              // 바로 한 번 그리고
  await fontsFor(d);
  if (my === seq) render(canvas, d, 2);   // 글자를 불러온 뒤 다시 그림
}

['number', 'name', 'start', 'end', 'issued'].forEach(id => $(id).addEventListener('input', () => { msg(''); preview(); }));

function pickGroup(sel, attr, onPick) {
  document.querySelectorAll(sel).forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll(sel).forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
    onPick(b.dataset[attr]);
  }));
}
pickGroup('[data-ai]', 'ai', v => { ai = v === '1'; preview(); });
pickGroup('[data-scale]', 'scale', v => { scale = parseFloat(v) || 1; });

/* ---------- 저장 ---------- */
function msg(t, err) { const m = $('msg'); m.textContent = t; m.classList.toggle('err', !!err); }
function fileName(d, ext) {
  const safe = t => (t || '').replace(/[\\/:*?"<>|]/g, '').trim();
  return [safe(d.number), safe(d.name)].filter(Boolean).join('_') + '_수료증.' + ext;
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function check(d) {
  if (!d.name) { msg('이름을 입력해 주세요.', true); $('name').focus(); return false; }
  return true;
}
const off = document.createElement('canvas');
let busy = false;
async function save(kind) {
  if (busy) return;
  const d = data(); if (!check(d)) return;
  busy = true; $('savePng').disabled = $('savePdf').disabled = true;
  try {
    await ready;
    await fontsFor(d);
    if (kind === 'png') {
      render(off, d, scale);
      const blob = await new Promise(r => off.toBlob(r, 'image/png'));
      download(blob, fileName(d, 'png'));
      msg(`${d.name} 님 수료증 이미지를 저장했습니다.`);
      remember();
    } else {
      render(off, d, 3);   // PDF는 인쇄 품질로
      const pdf = new jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4', compress: true });
      pdf.addImage(off.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
      download(pdf.output('blob'), fileName(d, 'pdf'));
      msg(`${d.name} 님 수료증 PDF를 저장했습니다.`);
      remember();
    }
  } catch (e) {
    console.error(e);
    msg('저장하지 못했습니다: ' + ((e && e.message) || e), true);
  } finally {
    busy = false; $('savePng').disabled = $('savePdf').disabled = false;
  }
}
$('savePng').addEventListener('click', () => save('png'));
$('savePdf').addEventListener('click', () => save('pdf'));

/* ---------- 이전 기록 (이 브라우저에만 보관) ---------- */
const HIST_KEY = 'fp-certificate-history-v1', HIST_MAX = 200;
function loadHist() {
  try { const v = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}
function saveHist(h) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, HIST_MAX))); } catch (e) {} }
let hist = loadHist();
let current = -1;

function snapshot() {
  return {
    num: $('number').value.replace(/\D/g, ''), name: $('name').value.trim(),
    start: $('start').value, end: $('end').value, issued: $('issued').value, ai, at: Date.now()
  };
}
function remember() {
  const r = snapshot();
  // 같은 번호·이름은 한 줄로 (최신 내용으로 바꾸고 맨 위로)
  hist = hist.filter(h => !(h.num === r.num && h.name === r.name));
  hist.unshift(r); saveHist(hist); current = 0; drawHist();
}
function esc(t) { return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function when(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function drawHist() {
  $('histList').innerHTML = hist.map((h, i) => `
    <li class="${i === current ? 'on' : ''}">
      <button type="button" class="go" data-i="${i}">
        <span class="t">${esc(h.name)}<small>${h.num ? NUM_PREFIX + h.num.padStart(NUM_DIGITS, '0') : '번호 없음'}</small></span>
        <span class="s">AI ${h.ai ? '이수' : '미이수'} · 발급 ${esc(fmtIssued(h.issued) || '-')} · ${when(h.at)} 저장</span>
      </button>
      <button type="button" class="del" data-del="${i}" aria-label="${esc(h.name)} 기록 지우기" title="지우기">×</button>
    </li>`).join('');
  $('histEmpty').style.display = hist.length ? 'none' : 'block';
  $('histClear').style.display = hist.length ? '' : 'none';
}
function setAi(v) {
  ai = v;
  document.querySelectorAll('[data-ai]').forEach(x => { const on = (x.dataset.ai === '1') === v; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
}
$('histList').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const i = +del.dataset.del; hist.splice(i, 1); saveHist(hist);
    if (current === i) current = -1; else if (current > i) current--;
    drawHist(); return;
  }
  const go = e.target.closest('[data-i]'); if (!go) return;
  const h = hist[+go.dataset.i];
  $('number').value = h.num || ''; $('name').value = h.name || '';
  $('start').value = h.start || ''; $('end').value = h.end || ''; $('issued').value = h.issued || '';
  setAi(!!h.ai);
  $('number').dispatchEvent(new Event('input'));   // 번호 안내 문구·미리보기 갱신
  current = +go.dataset.i; drawHist();
  msg(`${h.name} 님 수료증을 불러왔습니다.`);
  if (window.matchMedia('(max-width:900px)').matches) document.querySelector('.preview').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('histClear').addEventListener('click', () => {
  if (!confirm('이전 기록을 모두 지울까요?')) return;
  hist = []; current = -1; saveHist(hist); drawHist();
});
drawHist();

ready.then(() => { drawn = true; preview(); })
     .catch(e => msg(((e && e.message) || '수료증을 불러오지 못했습니다') + '. 새로고침해 주세요.', true));
window.__cert = { render, ready, L };   // 확인용
</script>
